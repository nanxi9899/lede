name: Consolidate LOVEWRT firmware into one release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Merge two kernel releases into one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OLD_TESTING: "20261119-090745-e013d25-testing-7.3"
          OLD_STABLE: "20261119-090745-e013d25-stable-6.18"
          NEW_TAG: "LOVEWRT-x86-64-20261119"
        run: |
          set -euo pipefail
          mkdir -p out

          echo "=== download testing-7.3 images ==="
          gh release download "$OLD_TESTING" --pattern '*.img.gz' --dir out
          for f in out/*.img.gz; do
            base=$(basename "$f" .img.gz)
            mv "$f" "out/${base}-testing-7.3.img.gz"
          done

          echo "=== download stable-6.18 images ==="
          gh release download "$OLD_STABLE" --pattern '*.img.gz' --dir out
          for f in out/*.img.gz; do
            base=$(basename "$f" .img.gz)
            case "$base" in
              *-testing-7.3) continue ;;
            esac
            mv "$f" "out/${base}-stable-6.18.img.gz"
          done

          echo "=== final firmware files ==="
          ls -lh out/

          echo "=== create consolidated release ==="
          gh release create "$NEW_TAG" \
            --target "${{ github.sha }}" \
            --title "LOVEWRT x86/64 firmware (4 images, dual kernel)" \
            --notes "LOVEWRT x86/64 firmware - 4 images (kernel 7.3 testing + 6.18 stable), OpenClash built-in. Files are suffixed with their kernel version." \
            out/*.img.gz

          echo "=== delete old per-kernel releases ==="
          gh release delete "$OLD_TESTING" --yes --cleanup-tag || true
          gh release delete "$OLD_STABLE" --yes --cleanup-tag || true

          echo "=== done ==="
          gh release view "$NEW_TAG"
