name: Build LOVEWRT amd64 (dual kernel + OpenClash) on upstream changes

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lede-amd64-build
  cancel-in-progress: false

env:
  TZ: UTC

jobs:
  gate:
    name: Check upstream changes
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
      upstream_sha: ${{ steps.gate.outputs.upstream_sha }}
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - name: Decide whether to build
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha=$(curl -fsSL --http1.1 --retry 5 --retry-delay 2 --connect-timeout 15 --max-time 60 \
            https://api.github.com/repos/coolsnowwolf/lede/commits/master \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          last_sha=$(curl -fsSL --http1.1 --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 60 \
            "https://raw.githubusercontent.com/${{ github.repository }}/master/.github/last-built-sha" || true)
          last_sha=$(printf '%s' "$last_sha" | tr -d '[:space:]')

          if [ -z "$last_sha" ] || [ "$upstream_sha" != "$last_sha" ]; then
            should_build=true
          else
            should_build=false
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            should_build=true
          fi

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y%m%d-%H%M%S)-${upstream_sha:0:7}" >> "$GITHUB_OUTPUT"

          if [ "$should_build" = "true" ]; then
            echo "Syncing fork with upstream $upstream_sha ..."
            curl -fsS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/merge-upstream" \
              -d '{"branch":"master"}' || echo "fork sync skipped (non-fatal)"
          fi

  build:
    name: Build x86/64 (kernel ${{ matrix.kernel_label }})
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel_label: stable-6.18
            testing_kernel: "n"
          - kernel_label: testing-7.3
            testing_kernel: "y"
    steps:
      - name: Checkout fork source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: master
          fetch-depth: 1

      - name: Reset source tree to upstream SHA
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/coolsnowwolf/lede.git
          git fetch --depth 1 upstream ${{ needs.gate.outputs.upstream_sha }}
          git checkout --force FETCH_HEAD
          echo "Source reset to upstream ${{ needs.gate.outputs.upstream_sha }}"
          git rev-parse HEAD

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses5-dev libssl-dev libelf-dev \
            libdw-dev liblzma-dev libsqlite3-dev uuid-dev \
            python3 python3-pip rsync unzip zlib1g-dev file wget curl \
            xsltproc perl

      - name: Cache downloads and ccache
        uses: actions/cache@v4
        with:
          path: |
            dl
            .ccache
          key: lede-amd64-${{ matrix.kernel_label }}-${{ needs.gate.outputs.upstream_sha }}
          restore-keys: |
            lede-amd64-${{ matrix.kernel_label }}-
            lede-amd64-

      - name: Prefetch erofs-utils source
        run: |
          set -euo pipefail
          mkdir -p dl
          url="https://github.com/erofs/erofs-utils/archive/refs/tags/v1.8.10.tar.gz"
          for i in 1 2 3 4 5; do
            if curl -fsSL --connect-timeout 20 --max-time 180 \
              "$url" -o dl/erofs-utils-1.8.10.tar.gz; then
              break
            fi
            echo "erofs-utils download failed, retry $i/5"
            sleep 10
          done
          expected="05eb4edebe11decce6ecb34e98d2f80c8cd283c2f2967d8ba7efd58418570514"
          actual=$(sha256sum dl/erofs-utils-1.8.10.tar.gz | awk '{print $1}')
          if [ "$actual" != "$expected" ]; then
            echo "erofs-utils checksum mismatch"
            exit 1
          fi

      - name: Update feeds
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            ./scripts/feeds update -a && break
            echo "feeds update failed, retry $i/3"
            sleep 15
          done
          ./scripts/feeds install -a

      - name: Patch host tool build flags
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("tools/erofs-utils/Makefile")
          s = p.read_text()
          needle = "include $(INCLUDE_DIR)/host-build.mk"
          insert = "HOST_CPPFLAGS += -I$(STAGING_DIR_HOST)/include/uuid\n\n"
          if "HOST_CPPFLAGS +=" not in s:
              s = s.replace(needle, insert + needle, 1)
              p.write_text(s)
          PY

      - name: Add OpenClash (built-in)
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/vernesong/OpenClash.git /tmp/openclash
          rm -rf package/luci-app-openclash
          mkdir -p package/luci-app-openclash
          cp -r /tmp/openclash/luci-app-openclash/. package/luci-app-openclash/
          rm -rf /tmp/openclash
          test -f package/luci-app-openclash/Makefile
          echo "OpenClash source added"
          grep -E 'PKG_VERSION|PKG_NAME' package/luci-app-openclash/Makefile | head -3

      - name: Harden profiles.json generator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/json_overview_image_info.py")
          s = p.read_text()
          old = '    default_packages, output["arch_packages"] = run('
          assert old in s, "generator target line not found"
          s = s.replace(old, '    _val_lines = run(', 1)
          tail = '    ).stdout.splitlines()\n'
          assert tail in s, "generator splitlines tail not found"
          s = s.replace(
              tail,
              '    ).stdout.splitlines()\n'
              '    default_packages = _val_lines[0] if _val_lines else ""\n'
              '    output["arch_packages"] = _val_lines[-1] if len(_val_lines) > 1 else ""\n',
              1,
          )
          p.write_text(s)
          print("patched json_overview_image_info.py")
          PY

      - name: Brand firmware as LOVEWRT
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          # 自定义开机 banner，%D 会被替换为 VERSION_DIST=LOVEWRT
          banner_lines = [
              "   _     _____     _________        ______ _____",
              "  | |   / _ \\ \\   / / ____\\ \\      / /  _ \\_   _|",
              "  | |  | | | \\ \\ / /|  _|  \\ \\ /\\ / /| |_) || |",
              "  | |__| |_| |\\ V / | |___  \\ V  V / |  _ < | |",
              "  |_____\\___/  \\_/  |_____|  \\_/\\_/  |_| \\_\\|_|  %D %V, %C",
          ]
          bp = Path("package/base-files/files/etc/banner")
          bp.parent.mkdir(parents=True, exist_ok=True)
          bp.write_text("\n".join(banner_lines) + "\n")
          # 首次启动将主机名/描述设为 LOVEWRT
          uci_lines = [
              "#!/bin/sh",
              "uci set system.@system[0].hostname='LOVEWRT'",
              "uci set system.@system[0].description='LOVEWRT'",
              "uci commit system",
              "exit 0",
          ]
          d = Path("files/etc/uci-defaults")
          d.mkdir(parents=True, exist_ok=True)
          f = d / "99_lovewrt-brand"
          f.write_text("\n".join(uci_lines) + "\n")
          f.chmod(0o755)
          # 强制发行名为 LOVEWRT：改 version.mk 的 fallback 默认，
          # 不依赖 CONFIG_VERSION_DIST（后者在某些配置下会被 defconfig 清掉）
          vm = Path("include/version.mk")
          vs = vm.read_text()
          vs = vs.replace(
              "VERSION_DIST:=$(if $(VERSION_DIST),$(VERSION_DIST),OpenWrt)",
              "VERSION_DIST:=$(if $(VERSION_DIST),$(VERSION_DIST),LOVEWRT)",
          )
          vs = vs.replace(
              "VERSION_MANUFACTURER:=$(if $(VERSION_MANUFACTURER),$(VERSION_MANUFACTURER),OpenWrt)",
              "VERSION_MANUFACTURER:=$(if $(VERSION_MANUFACTURER),$(VERSION_MANUFACTURER),LOVEWRT)",
          )
          vm.write_text(vs)
          print("Branding applied: LOVEWRT")
          PY

      - name: Configure x86/64 target (kernel ${{ matrix.kernel_label }})
        run: |
          set -euo pipefail
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_CCACHE=y
          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_kmod-virtio-net=y
          CONFIG_PACKAGE_kmod-e1000e=y
          CONFIG_TESTING_KERNEL=${{ matrix.testing_kernel }}
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_dnsmasq-full=y
          # CONFIG_PACKAGE_dnsmasq is not set
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_VERSIONOPT=y
          CONFIG_VERSION_DIST="LOVEWRT"
          CONFIG_VERSION_NUMBER="1.0"
          CONFIG_VERSION_CODE="LOVEWRT"
          EOF
          make defconfig
          echo "Selected target:"
          grep -E '^CONFIG_TARGET_(x86|x86_64|x86_64_DEVICE_generic)=' .config
          echo "OpenClash selection:"
          grep -E '^CONFIG_PACKAGE_luci-app-openclash=' .config || echo "WARNING: OpenClash not selected"
          echo "Branding (version.mk fallback enforced in previous step):"
          grep -E '^CONFIG_VERSIONOPT=|^CONFIG_VERSION_DIST=' .config || echo "note: VERSIONOPT not in .config; version.mk fallback ensures LOVEWRT"

      - name: Download packages
        run: |
          set -euo pipefail
          make download -j8 || make download -j1

      - name: Compile kernel ${{ matrix.kernel_label }}
        run: |
          set -euo pipefail
          make -j"$(nproc)" || make -j1 V=s

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd bin/targets/x86/64
          find . -maxdepth 1 -type f ! -name 'sha256sums.txt' -printf '%f\n' | sort | xargs sha256sum > sha256sums.txt

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOVEWRT-amd64-${{ matrix.kernel_label }}-${{ needs.gate.outputs.tag }}
          path: bin/targets/x86/64/*
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gate.outputs.tag }}-${{ matrix.kernel_label }}
          UPSTREAM_SHA: ${{ needs.gate.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "LOVEWRT amd64 [${{ matrix.kernel_label }}] $TAG" \
            --notes "LOVEWRT x86/64 firmware (kernel ${{ matrix.kernel_label }}, OpenClash built-in), based on Lean's LEDE. Upstream: $UPSTREAM_SHA. Triggered by ${{ github.event_name }} at $(date -u +'%Y-%m-%d %H:%M:%S UTC')." \
            bin/targets/x86/64/*

  finalize:
    name: Finalize
    needs: [gate, build]
    if: needs.gate.outputs.should_build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Record built upstream SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ needs.gate.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${{ github.repository }}/contents/.github/last-built-sha"
          file_sha=$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" "$api" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("sha",""))' || true)
          python3 - "$UPSTREAM_SHA" "$file_sha" <<'PY' > /tmp/last_sha_payload.json
          import base64
          import json
          import sys

          sha = sys.argv[1]
          existing = sys.argv[2]
          obj = {
              "message": "ci: record upstream build " + sha,
              "content": base64.b64encode((sha + "\n").encode()).decode(),
              "branch": "master",
          }
          if existing:
              obj["sha"] = existing
          print(json.dumps(obj))
          PY
          curl -fsS -X PUT -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "$api" --data-binary @/tmp/last_sha_payload.json >/dev/null
          echo "Recorded upstream SHA: $UPSTREAM_SHA"

      - name: Delete releases older than 30 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          jqexpr=".[] | select(.created_at < \"$cutoff\") | .id"
          gh api --paginate "repos/${{ github.repository }}/releases" --jq "$jqexpr" \
          | while read -r id; do
              if [ -n "$id" ]; then
                gh api -X DELETE "repos/${{ github.repository }}/releases/$id" >/dev/null || true
              fi
            done
